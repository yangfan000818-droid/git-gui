name: Release

on:
  push:
    tags: ["v*"]

env:
  HUSKY: "0" # CI 跳过 husky 安装(pre-commit hook 只在本地需要)

jobs:
  # ── 质量门(同 CI) ──
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  svelte-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install & check
        run: |
          cd gui
          npm ci
          npm run version:check -- "$GITHUB_REF_NAME"
          npx svelte-kit sync
          npx svelte-check --tsconfig ./tsconfig.json
          npm run format:check
          npm test

  # ── 创建 Release,正文由提交记录生成(构建前完成,避免各平台并发创建) ──
  release:
    needs: [lint-test, svelte-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史与 tag 计算上一版本

      - name: Create or update release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          node scripts/release-notes.mjs "$TAG" > notes.md
          cat >> notes.md <<'EOF'

          ---

          > **macOS 用户**：首次打开提示「已损坏无法打开」是因为应用未签名。
          > 解决方法：打开终端，运行 `xattr -cr /Applications/GitSail.app` 后再打开即可。
          > 或右键点击 app → 打开 → 再点一次「打开」。
          EOF
          cat notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ── 双平台构建(macOS aarch64 / Windows x64;不出 Linux / Intel Mac) ──
  build:
    needs: [release]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clean stale bundles
        shell: bash
        run: rm -rf target/release/bundle

      - name: Build Tauri
        run: |
          cd gui
          npm ci
          npx tauri build --ci

      # ── 上传到 Release(Release 已由 release job 创建,这里只传文件、不动正文) ──
      - name: Upload to Release
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ "$RUNNER_OS" = "macOS" ]; then
            gh release upload "$TAG" target/release/bundle/dmg/*.dmg --clobber
          else
            gh release upload "$TAG" target/release/bundle/nsis/*.exe --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ── 更新 manifest:下载 Windows 安装包,签名,生成 latest.json ──
  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release-notes.mjs 需要完整历史与 tag

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install deps
        run: cd gui && npm ci

      - name: Download Windows installer from this release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # build 已上传完安装包,但 GitHub API 读 release 可能短暂滞后:v1.3.1 曾在上传
          # 近 1 分钟后仍读到空附件列表("no assets to download")。轮询重试,最多约 3 分钟。
          for i in $(seq 1 18); do
            if gh release download "$TAG" --pattern "*x64-setup.exe" --dir assets --clobber ||
              gh release download "$TAG" --pattern "*.exe" --dir assets --clobber; then
              exit 0
            fi
            echo "第 $i 次未取到 Windows 安装包,10 秒后重试"
            sleep 10
          done
          echo "ERROR: 多次重试后仍未取到 Windows 安装包"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate latest.json
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          EXE=$(ls assets/*.exe 2>/dev/null | head -1)
          WIN_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$EXE")"

          # 签名:tauri signer 把真正的签名写入 <FILE>.sig 文件;
          # stdout 只是人类提示文本("Your file was signed successfully..."),
          # 切勿重定向 stdout 当签名(会导致客户端 base64 解码报 Invalid symbol 32, offset 4)。
          cd gui
          npx tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "" \
            "../$EXE"
          cd ..

          # 签名文件与输入同名加 .sig,内容是一整段 base64(Tauri updater signature 字段所需格式)。
          SIG_FILE="$EXE.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "ERROR: signature file not found: $SIG_FILE"
            exit 1
          fi
          export WIN_URL VERSION
          WIN_SIG=$(cat "$SIG_FILE")
          export WIN_SIG
          # 更新说明与 Release 正文同源(不含 macOS 提示,manifest 只服务 Windows)。
          node scripts/release-notes.mjs "$TAG" > notes.md
          export NOTES_FILE=notes.md
          node scripts/build-manifest.mjs
          cat latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload manifest to Release
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" latest.json
        env:
          GH_TOKEN: ${{ github.token }}

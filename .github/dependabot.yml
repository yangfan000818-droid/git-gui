# Dependabot:每周一检查依赖更新。
# 小版本 / 补丁按生态合成一个 PR;大版本各自单独 PR(需人工评估迁移)。
#
# ⚠️ Tauri 的 npm 包(@tauri-apps/*)与 Rust crate(tauri / tauri-*)必须在同一
# major.minor,否则 `tauri build` 报 "Found version mismatched Tauri packages"。
# 两边各有一个 tauri 分组 PR,minor 变化时单独合任何一个都会让构建失败 ——
# 需在其中一个分支上合入另一个,一起合并。
version: 2
updates:
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
      day: monday
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@tauri-apps/*"]
    ignore:
      # TypeScript 7(Go 原生版)暂不可用:@sveltejs/kit 与 svelte-check 的 peer 依赖
      # 只到 "^5 || ^6"。两者声明支持 TS 7 后删掉这条。
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["tauri", "tauri-*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
